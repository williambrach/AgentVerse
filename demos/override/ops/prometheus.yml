# Scrapes the game's admin listener. Bind Prometheus to 127.0.0.1 too.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: override
    metrics_path: /metrics
    # File holding only the OVERRIDE_ADMIN_TOKEN value (no trailing text).
    authorization:
      type: Bearer
      credentials_file: /path/to/admin-token
    static_configs:
      - targets: ['127.0.0.1:3002']


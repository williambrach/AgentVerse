<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Override · Content editor</title>
<script src="/admin/theme.js"></script>
<link rel="stylesheet" href="/admin/app.css">
<link rel="stylesheet" href="/admin/maker.css">
<script type="module" src="/admin/maker.js"></script>
</head>
<body>
<header class="top">
  <h1>Content editor</h1>
  <nav class="top-links"><a id="back-link" href="/admin/">Command centre</a></nav>
  <nav id="cases" aria-label="Cases"><select id="case-select" aria-label="Case"></select></nav>
  <span id="status" class="status">offline</span>
  <span id="dirty-count" class="muted"></span>
  <span id="publish-note" class="muted"></span>
  <button id="publish" class="primary" type="button">Publish</button>
  <button id="theme-toggle" type="button" class="ghost" aria-pressed="false">Light mode</button>
  <form class="auth" id="auth" hidden>
    <input id="password" type="password" placeholder="admin password" autocomplete="current-password">
    <button id="signin" type="submit">Sign in</button>
    <span id="auth-error" class="auth-error" role="alert"></span>
  </form>
  <button id="signout" type="button" class="ghost" hidden>Sign out</button>
</header>
<div class="simple">
  <div class="side"><nav id="sections" aria-label="Sections"></nav></div>
  <main id="editor"><section id="section" class="form-section"></section></main>
  <aside id="panel" class="card chat">
    <div class="card-head"><h2 class="card-title">Try this actor</h2><button id="new-chat" type="button" class="ghost">New chat</button></div>
    <select id="character" aria-label="Character" hidden></select>
    <div id="thread" aria-live="polite"></div>
    <p id="try-note" class="muted"></p>
    <form id="ask"><input id="question" type="text" autocomplete="off" placeholder="Ask a question…"><button id="try" type="submit" class="primary">Send</button></form>
    <button id="preview" type="button" class="ghost">Show prompt</button>
    <div id="prompt-box" hidden><pre id="prompt"></pre></div>
  </aside>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Override · Command centre</title>
<script src="/admin/theme.js"></script>
<link rel="stylesheet" href="/admin/app.css">
<link rel="stylesheet" href="/admin/tiles.css">
<link rel="stylesheet" href="/admin/charts.css">
<link rel="stylesheet" href="/admin/log.css">
<link rel="stylesheet" href="/admin/round.css">
<link rel="stylesheet" href="/admin/controls.css">
<link rel="stylesheet" href="/admin/board.css">
<link rel="stylesheet" href="/admin/centre.css">
<script type="module" src="/admin/app.js"></script>
</head>
<body>
<header class="top">
  <h1>Command centre</h1>
  <span id="status" class="status">offline</span>
  <nav class="top-links">
    <a id="board-link" target="_blank" rel="noreferrer" hidden>big-screen ↗</a>
    <a id="maker-link" href="/admin/maker.html">Content editor</a>
  </nav>
  <div id="bar"></div>
  <button id="theme-toggle" type="button" class="ghost" aria-pressed="false">Light mode</button>
  <form class="auth" id="auth" hidden>
    <input id="password" type="password" placeholder="password" autocomplete="current-password">
    <button id="signin" type="submit">Sign in</button>
    <span id="auth-error" class="auth-error" role="alert"></span>
  </form>
  <button id="signout" type="button" class="ghost" hidden>Sign out</button>
</header>
<main class="centre">
<section id="watch" hidden></section>
<section class="area" id="area-live"><h2 class="area-title">Live now <span id="health-badge" class="badge" hidden></span></h2>
  <section id="players"></section>
  <section id="tiles"></section>
  <p id="data-path" class="muted data-path" hidden></p>
  <div class="charts-head"><span class="card-title">Last</span><span id="range" class="range"></span></div>
  <section id="charts"></section>
</section>
<section class="area" id="area-players"><h2 class="area-title">Players and log</h2>
  <div class="cols"><section id="log" class="card"></section><div class="side"><section id="board" class="card"></section></div></div>
</section>
<section class="area" id="area-results"><h2 class="area-title">Results</h2>
  <div class="results"><section id="funnel" class="card"></section><section id="tallies" class="card"></section></div>
</section>
<section class="area" id="area-llm"><h2 class="area-title">LLM ops</h2><section id="controls" class="card"></section></section>
<details class="panel" data-panel="records"><summary><span class="panel-title">System records</span></summary><section id="system-records"></section></details>
</main>
<aside id="player-panel" hidden></aside>
</body>
</html>
